<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>BurningNeox — Play Online</title>
<meta name="description" content="Enter BurningNeox: run, jump, customize your character, master special skills, and challenge friends in the arena.">
<meta name="theme-color" content="#172b57">
<link rel="icon" type="image/png" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="BurningNeox">
<meta property="og:title" content="BurningNeox — Enter the Arena">
<meta property="og:description" content="Run, jump, dash, customize your hero, and join friends in the BurningNeox arena. Your next adventure starts here!">
<meta property="og:url" content="https://someonenihha-crypto.github.io/BurningNeox-Game/">
<meta property="og:image" content="https://someonenihha-crypto.github.io/BurningNeox-Game/icon.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="BurningNeox — Enter the Arena">
<meta name="twitter:description" content="Run, jump, dash, customize your hero, and join friends in the BurningNeox arena.">
<meta name="twitter:image" content="https://someonenihha-crypto.github.io/BurningNeox-Game/icon.png">
<style>
:root{--bg:#0d1020;--ink:#fff;--acc:#ffd166;--acc2:#ef476f;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080a14}}
:root[data-theme="dark"]{--bg:#080a14}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);background:radial-gradient(ellipse at center,#0000 30%,#000b 100%)}
.scr.on{display:flex}
h1{margin:0;font-size:clamp(40px,12vh,90px);font-style:italic;font-weight:900;letter-spacing:2px;background:linear-gradient(#fff,var(--acc) 55%,var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #0009) drop-shadow(0 0 18px #ffd16688);animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.sub{margin:6px 0 22px;opacity:.85;letter-spacing:5px;font-size:14px}
.btn{font:inherit;font-weight:800;border:0;color:#1a1020;background:linear-gradient(var(--acc),#f79f1f);border-radius:999px;padding:12px 60px;font-size:clamp(20px,6vh,30px);box-shadow:0 6px 0 #a65f00,0 12px 24px #0008;animation:pu 1.6s infinite}
.btn:active{animation:none;transform:translateY(4px);box-shadow:0 2px 0 #a65f00}
@keyframes pu{50%{filter:brightness(1.15);transform:scale(1.05)}}
h2{margin:0 0 8px;font-size:clamp(20px,6vh,30px);text-shadow:0 3px 0 #0008}
.row{display:flex;gap:12px;max-width:100%;overflow-x:auto;padding:10px 16px}
.card{flex:0 0 auto;width:min(22vw,220px);border-radius:16px;overflow:hidden;background:#000b;border:3px solid #fff4;text-align:center}
.card:active{transform:scale(.96);border-color:var(--acc)}
.card canvas{display:block;width:100%;aspect-ratio:8/5}
.card b{display:block;padding:7px;font-size:15px}
.sm{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));font:inherit;font-weight:700;color:#fff;background:#0007;border:2px solid #fff5;border-radius:12px;padding:8px 16px;font-size:15px;pointer-events:auto}
#hud{position:fixed;inset:0;display:none;pointer-events:none}
#hud.on{display:block}
#joy{position:absolute;left:calc(26px + env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:116px;height:116px;border-radius:50%;background:#ffffff26;border:3px solid #fff5;pointer-events:auto;touch-action:none}
#joy i{position:absolute;color:#fffa;font-style:normal;font-size:11px}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#aab);box-shadow:0 4px 10px #0008}
#rot{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:22px;background:#000e}
@media (orientation:portrait){#rot{display:flex}}
input{user-select:text;-webkit-user-select:text}
#cust{display:none;grid-template-columns:72px minmax(0,1fr) minmax(200px,34%);grid-template-rows:44px minmax(0,1fr);gap:10px 14px;align-items:stretch;justify-items:stretch;justify-content:stretch;background:rgba(8,10,25,.74)}
#cust.on{display:grid}
.rb{grid-area:1/1;justify-self:start;width:44px;height:44px;border-radius:50%;border:0;background:#ff1744;color:#fff;font-size:28px;font-weight:900;padding:0 0 3px;box-shadow:0 3px 0 #a00}
#nm{grid-area:1/2;height:44px;border-radius:22px;border:0;background:#444;color:#f4ff00;font:inherit;font-weight:800;font-size:18px;text-align:center;padding:0 16px;outline:0;min-width:0}
#nm::placeholder{color:#f4ff0099}
#strip{grid-area:2/1;align-self:center;display:flex;flex-direction:column;gap:10px;padding:10px 8px;background:#2d6bd88c;border-radius:34px}
#strip button{width:54px;height:54px;border-radius:14px;border:2px solid transparent;background:#1d4fa8;color:#fff;padding:11px}
#strip button.on{border-color:var(--acc);background:#2a6be0}
svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
#mid{grid-area:2/2;display:flex;flex-direction:column;gap:10px;min-height:0}
#pc{flex:1 1 0;min-height:0;width:100%}
#pnl{height:clamp(112px,32vh,160px);background:#0008;border:2px solid #fff3;border-radius:16px;padding:8px;flex:0 0 auto}
.pp{display:none;height:100%;gap:10px;align-items:center}
.pp.on{display:flex}
.lst{overflow-x:auto;overflow-y:hidden;touch-action:pan-x}
.lst button{flex:0 0 auto;width:66px;height:66px;border-radius:12px;background:#ffffff1a;border:2px solid transparent;padding:0}
.lst button.sel{border-color:var(--acc);background:#ffd16633}
.lst canvas{width:100%;height:100%;display:block}
#svw{position:relative;height:100%;aspect-ratio:3/2;flex:0 0 auto}
#sv{width:100%;height:100%;border-radius:10px;touch-action:none;display:block}
#mk{position:absolute;width:16px;height:16px;margin:-8px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #0008;pointer-events:none}
#cr{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
#hue{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:7px;background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);margin:0}
#hue::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid #333}
#hue::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #333}
.hr{display:flex;gap:8px;align-items:center}
#sw{width:28px;height:28px;border-radius:8px;border:2px solid #fff;flex:0 0 auto}
#hex{flex:1;min-width:0;height:28px;border-radius:8px;border:0;background:#fff2;color:#fff;font:inherit;text-align:center;font-size:14px}
#sws{display:flex;gap:6px;flex-wrap:wrap}
#sws button{width:22px;height:22px;border-radius:50%;border:2px solid #fff8;padding:0}
#rc{grid-area:1/3/3/4;display:flex;flex-direction:column;gap:10px;min-height:0}
#mc{width:100%;aspect-ratio:16/9;border-radius:16px;background:#000;display:block}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:6px}
.ar{width:44px;height:44px;border-radius:50%;border:0;background:#0047c8;color:#fff;font-size:26px;font-weight:700;padding:0 0 3px}
#mn{font-size:clamp(18px,5vh,26px);font-weight:800;text-shadow:0 2px 0 #0008}
#go{width:100%;padding:12px 0;background:linear-gradient(#34d65a,#1fa83f);color:#fff;box-shadow:0 6px 0 #127a2b,0 12px 24px #0008}

#cust.join-mode #rc{visibility:visible!important;justify-content:center;align-self:stretch}
#cust.join-mode #mc,#cust.join-mode #rc .mrow{display:none!important}
#cust.join-mode #go{display:block;margin:auto 0;min-height:58px;font-size:clamp(21px,5vh,28px);letter-spacing:1px}


/* Enhanced pause and settings UI */
#menuBtn{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));width:58px;height:58px;border-radius:50%;border:2px solid #ffffff9c;color:#fff;background:radial-gradient(circle at 30% 25%,#7dd3fc,#164eaa 72%);box-shadow:0 0 0 5px #60a5fa22,0 8px 24px #0009,0 0 22px #38bdf866;display:grid;place-items:center;padding:13px;pointer-events:auto;transition:transform .2s,filter .2s}
#menuBtn:active{transform:scale(.88) rotate(-8deg);filter:brightness(1.35)}
#skillBtn{position:absolute;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:88px;height:88px;border-radius:50%;border:3px solid #b7f6ff;color:#fff;background:radial-gradient(circle at 32% 24%,#b9f6ff,#2879d8 52%,#102d76);box-shadow:0 0 0 5px #38bdf833,0 0 28px #38bdf899,inset 0 3px 10px #fff8;display:grid;place-items:center;padding:10px;pointer-events:auto;font:inherit;font-weight:900;transition:transform .15s,filter .15s}
#skillBtn:active{transform:scale(.9);filter:brightness(1.35)}#skillBtn:disabled{filter:grayscale(.8);opacity:.7}
#skillBtn .skill-icon{width:48px;height:48px;display:grid;place-items:center;line-height:1}#skillBtn .skill-icon svg{width:100%;height:100%;stroke:#fff;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 7px currentColor)}#skillBtn .skill-cd{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;background:#07152dbb;font-size:22px;text-shadow:0 2px 4px #000}
#skillBtn .skill-name{position:absolute;bottom:-22px;white-space:nowrap;font-size:12px;text-shadow:0 2px 4px #000}
#strip button{position:relative}#weaponList{display:flex;gap:8px;width:100%;height:100%;align-items:stretch;overflow-x:auto} .weapon-card{flex:1 0 30%;min-width:105px;border:2px solid #fff3;border-radius:12px;background:linear-gradient(145deg,#ffffff20,#09152b);color:#fff;font:inherit;font-size:12px;font-weight:800;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.weapon-card.sel{border-color:#ffd166;box-shadow:0 0 15px #ffd16666;background:#ffd16622}.weapon-card .wico{width:42px;height:42px;display:grid;place-items:center;filter:drop-shadow(0 2px 5px #000)}.weapon-card .wico svg{width:100%;height:100%;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}.weapon-card small{font-size:10px;opacity:.75;font-weight:500}
#menuBtn svg{width:100%;height:100%;stroke:#fff;stroke-width:2.8}
#pauseLayer,#settingsLayer{position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#173b82a8,#07122bdc 72%,#030817ee);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#pauseLayer.on,#settingsLayer.on{display:flex;animation:veilIn .28s ease both}
@keyframes veilIn{from{opacity:0}to{opacity:1}}
.pause-panel{position:relative;width:min(92vw,560px);padding:clamp(18px,4vh,34px);border:1px solid #b9dcff70;border-radius:34px;background:linear-gradient(145deg,#163d79d9,#111b43eF 65%,#17133feF);box-shadow:0 24px 80px #0009,inset 0 1px #fff5;display:flex;flex-direction:column;align-items:center;gap:clamp(12px,3vh,24px);animation:panelIn .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes panelIn{from{transform:translateY(24px) scale(.88);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.pause-title{font-size:clamp(36px,9vh,62px);font-weight:1000;font-style:italic;letter-spacing:1px;color:#eaf5ff;text-shadow:0 4px 0 #163d80,0 0 26px #60a5fa;animation:titleFloat 2.8s ease-in-out infinite}
@keyframes titleFloat{50%{transform:translateY(-5px)}}
.pause-actions{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,4vw,30px);width:min(100%,390px);justify-items:center}
.pause-action{width:clamp(112px,27vw,154px);height:clamp(112px,27vw,154px);border-radius:50%;border:3px solid #ffffff75;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font:inherit;font-weight:900;font-size:clamp(13px,3.2vw,17px);box-shadow:inset 0 3px 10px #fff5,0 12px 26px #0008;transition:transform .2s,filter .2s;position:relative;overflow:hidden}
.pause-action:before{content:'';position:absolute;inset:7px;border-radius:50%;border:1px solid #ffffff65;pointer-events:none}
.pause-action:active{transform:scale(.9);filter:brightness(1.3)}
.pause-action svg{width:42%;height:42%;stroke:#fff;stroke-width:2.6;fill:none;filter:drop-shadow(0 2px 3px #0008)}
.pause-action span{position:relative;text-shadow:0 2px 4px #0008}
#resumeBtn{background:radial-gradient(circle at 32% 22%,#7aff88,#14c934 58%,#087b2b);box-shadow:0 0 28px #25e84c66,inset 0 3px 10px #fff6,0 12px 26px #0008}
#exitBtn{background:radial-gradient(circle at 32% 22%,#ff7777,#f20d27 58%,#93051a);box-shadow:0 0 28px #ff263f66,inset 0 3px 10px #fff6,0 12px 26px #0008}
#settingsBtn{grid-column:1/3;width:clamp(104px,24vw,132px);height:clamp(104px,24vw,132px);background:radial-gradient(circle at 32% 22%,#b9c5d8,#626f86 58%,#30394b);box-shadow:0 0 25px #cbd5e155,inset 0 3px 10px #fff7,0 12px 26px #0008}
.settings-panel{width:min(90vw,430px);padding:26px;border-radius:28px;border:1px solid #ffffff65;background:linear-gradient(145deg,#1b3767f5,#17172ff5);box-shadow:0 22px 70px #000b;display:flex;flex-direction:column;gap:20px;animation:panelIn .35s ease both}
.settings-head{display:flex;align-items:center;justify-content:space-between;font-size:clamp(23px,5vh,32px);font-weight:900}
#settingsBack{width:42px;height:42px;border:0;border-radius:50%;background:#ffffff20;color:#fff;font-size:25px;font-weight:900}
.setting-label{display:flex;justify-content:space-between;font-weight:800;font-size:17px}
#joyScale{width:100%;accent-color:#60a5fa;height:28px}
.setting-note{font-size:12px;color:#d5e4ffb8}
.settings-preview{height:94px;display:flex;align-items:center;gap:18px;padding:12px;border-radius:18px;background:#ffffff0c}
#joyPreview{width:70px;height:70px;border-radius:50%;border:2px solid #ffffff88;background:#ffffff20;display:grid;place-items:center;transition:transform .15s}
#joyPreview i{width:30px;height:30px;border-radius:50%;background:linear-gradient(#fff,#9eacc2);box-shadow:0 3px 8px #0008}
#settingsDone{border:0;border-radius:999px;padding:12px 28px;color:#fff;font:inherit;font-weight:900;background:linear-gradient(#4da5ff,#1760c9);box-shadow:0 5px 0 #0c3982}
@media(max-height:430px){.pause-panel{padding:10px 22px;gap:8px}.pause-title{font-size:34px}.pause-action{width:94px;height:94px}.settings-panel{padding:14px;gap:10px}}


/* Multiplayer prototype UI */
#modePick,#multiScreen{z-index:5;background:radial-gradient(ellipse at 50% 40%,#244a83dd,#070d20f5 78%);gap:16px}
.mp-panel{width:min(92vw,560px);max-height:82vh;padding:22px;border:1px solid #9bd5ff66;border-radius:26px;background:linear-gradient(145deg,#153b70ee,#10152fee);box-shadow:0 22px 70px #000b;display:flex;flex-direction:column;gap:14px}
.mp-title{font-size:clamp(28px,7vh,44px);font-weight:1000;text-align:center;color:#e8f6ff;text-shadow:0 0 20px #38bdf8}
.mp-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.mp-btn{border:1px solid #ffffff55;border-radius:16px;padding:13px 20px;color:#fff;font:inherit;font-weight:900;background:linear-gradient(#3989e8,#164b9d);box-shadow:0 5px 0 #0c2d65;min-width:145px}
.mp-btn.alt{background:linear-gradient(#3bdc79,#128345);box-shadow:0 5px 0 #07532a}
.mp-btn:disabled{opacity:.45}
#roomList{overflow:auto;min-height:120px;max-height:42vh;display:flex;flex-direction:column;gap:9px;padding:4px}
.room-card{display:flex;align-items:center;gap:10px;text-align:left;padding:12px;border-radius:15px;border:1px solid #ffffff35;background:#ffffff12;color:#fff;font:inherit}
.room-card .room-info{flex:1;min-width:0}.room-card small{display:block;color:#c8dcf4;margin-top:3px}.room-card strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mpStatus{min-height:22px;text-align:center;color:#c7e8ff;font-size:13px}
#hostPlayersBtn{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(88px + env(safe-area-inset-right,0px));width:48px;height:48px;border-radius:50%;border:2px solid #ffffff9c;color:#fff;background:radial-gradient(circle at 30% 25%,#9df7d1,#087b64 72%);box-shadow:0 0 18px #34d39988;display:none;place-items:center;padding:11px;pointer-events:auto}
#hostPlayersBtn svg{stroke:#fff;stroke-width:2.2}
#playersLayer{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:#030817c9;backdrop-filter:blur(7px)}
#playersLayer.on{display:flex}.players-panel{width:min(92vw,480px);max-height:80vh;overflow:auto;padding:18px;border-radius:24px;background:linear-gradient(145deg,#17416c,#10172d);border:1px solid #a7dcff77;box-shadow:0 20px 60px #000b}
.player-row{display:flex;align-items:center;gap:10px;padding:10px;margin-top:8px;border-radius:13px;background:#ffffff12;color:#fff}.player-row .pmeta{flex:1;min-width:0}.player-row small{display:block;color:#c4d8ee}.kick{border:0;border-radius:10px;padding:8px 12px;background:#d92c48;color:#fff;font-weight:800}
@media(max-height:430px){.mp-panel{padding:12px;gap:8px}.mp-title{font-size:26px}#roomList{max-height:28vh}}

</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="scr on" id="menu">
  <h1>BURNING NEOX</h1>
  <div class="sub">اركض · اقفز · انزلق</div>
  <button class="btn" id="play">Play</button>
</div>

<div class="scr" id="cust">
  <button class="rb" id="bk">‹</button>
  <input id="nm" maxlength="14" placeholder="Name your character" autocomplete="off">
  <div id="strip">
    <button class="on"><svg viewBox="0 0 24 24"><path d="M7 15V4h10v11M7 11h10M3 16h18"/></svg></button>
    <button><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.4 0 2-1 1.5-2.2-.5-1.2.2-2.3 1.6-2.3H17a4 4 0 0 0 4-4c0-5-4-9.5-9-9.5z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/></svg></button>
    <button><svg viewBox="0 0 24 24"><path d="M8 3 3 6.5 5.5 10 8 8.8V21h8V8.8l2.5 1.2L21 6.5 16 3a4 4 0 0 1-8 0z"/></svg></button>
    <button><svg viewBox="0 0 24 24"><path d="m3 17 5-10 4 6 3-4 6 8H3Z"/><path d="M7 4h.01M17 4h.01"/></svg></button>
  </div>
  <div id="mid">
    <canvas id="pc"></canvas>
    <div id="pnl">
      <div class="pp lst on" id="p0"></div>
      <div class="pp" id="p1"><div id="svw"><canvas id="sv" width="150" height="100"></canvas><div id="mk"></div></div>
        <div id="cr"><input id="hue" type="range" min="0" max="359"><div class="hr"><span id="sw"></span><input id="hex" maxlength="7"></div><div id="sws"></div></div></div>
      <div class="pp lst" id="p2"></div>
      <div class="pp" id="p3"><div id="weaponList"></div></div>
    </div>
  </div>
  <div id="rc">
    <canvas id="mc"></canvas>
    <div class="mrow"><button class="ar" id="pv">‹</button><span id="mn"></span><button class="ar" id="nx">›</button></div>
    <button class="btn" id="go">Play</button>
  </div>
</div>

<div id="hud">
  <button id="menuBtn" aria-label="فتح القائمة"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <button id="skillBtn" aria-label="استخدام مهارة السلاح"><span class="skill-icon" aria-hidden="true"></span><span class="skill-name">Skill</span><span class="skill-cd" style="display:none"></span></button>
  <div id="joy"><i style="left:50%;top:6px;transform:translateX(-50%)">▲</i><i style="left:50%;bottom:6px;transform:translateX(-50%)">▼</i><i style="left:8px;top:50%;transform:translateY(-50%)">◀</i><i style="right:8px;top:50%;transform:translateY(-50%)">▶</i><div id="knob"></div></div>
